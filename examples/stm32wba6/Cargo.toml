[package]
edition = "2024"
name = "trouble-stm32wba-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [ "defmt", "time-driver-any", "memory-x", "exti" ]  }
embassy-stm32-wpan = { version = "0.1.0", features = ["defmt", "bt-hci", "wba-ble" ] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["defmt", "platform-cortex-m", "executor-thread" ] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-net = { version = "0.9.1", features = ["defmt", "udp", "proto-ipv6", "medium-ieee802154", ], optional = true }
trouble-example-apps = { version = "0.1.0", path = "../apps", features = ["defmt"] }
trouble-host = { path = "../../host", features = ["default-packet-pool-mtu-255"] }
# The BAP/ASCS protocol logic the sink example drives.
trouble-audio = { path = "../../audio" }
bt-hci = "0.10"
embassy-futures = "0.1.1"

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
embedded-hal = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = { version = "0.9", default-features = false }
static_cell = "2"

[features]
default = ["stm32wba65ri"]
# Chip support plus the link-layer-only (`llo`) stack, so the BLE host runs in Rust.
stm32wba65ri-core = [ "embassy-stm32-wpan/stm32wba65ri", "embassy-stm32-wpan/ble-stack-llo" ]
# Default build: Basic link layer, which does not support isochronous channels.
stm32wba65ri = [ "stm32wba65ri-core", "embassy-stm32-wpan/linklayer6-ble-basic" ]
# ISO / LE Audio: Full link layer (required for CIS/BIS) plus trouble-host ISO support.
# Build with --no-default-features: the Basic and Full link layer images cannot be linked together.
stm32wba65ri-iso = [ "stm32wba65ri-core", "embassy-stm32-wpan/linklayer6-ble-full", "trouble-host/iso" ]
# LE Audio unicast sink: ISO plus the PACS and ASCS GATT services.
stm32wba65ri-audio = [ "stm32wba65ri-iso", "trouble-host/le-audio" ]

[[bin]]
name = "ble_bas_peripheral"

[[bin]]
name = "iso_bringup"
required-features = ["stm32wba65ri-iso"]

[[bin]]
name = "ble_audio_sink"
required-features = ["stm32wba65ri-audio"]

[[bin]]
name = "iso_tx_probe"
required-features = ["stm32wba65ri-iso"]

[[bin]]
name = "iso_sink"
required-features = ["stm32wba65ri-iso"]

[[bin]]
name = "iso_central"
required-features = ["stm32wba65ri-iso"]

